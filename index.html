<head>

<title>Suivi nutritionnel</title>
<meta name="description" content="Journal des repas, des pas et du poids, gardé sur votre téléphone.">

<meta name="theme-color" content="#121b2b" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap">
<style>
:root {
  /* Un registre de comptes : chaux blanche, encre marine, bleu des portes de Sidi Bou Saïd.
     Colonne unique pour téléphone ; les totaux portent le double trait comptable. */
  --plan: #f1f4f8;
  --surface: #ffffff;
  --encre: #0f2136;
  --encre-2: #45566b;
  --encre-3: #5e6c7e;
  --trait: #dce3ea;
  --trait-fort: #b9c4d0;
  --bleu: #1b5fb0;
  --bleu-fonce: #134a8c;
  --bleu-pale: #e6effa;
  --sur-bleu: #ffffff;
  --surlignage: #fff1b8;
  --serie: #2a78d6;
  --serie-attenue: #86b6ef;
  --piste: #cde2fb;
  --texte-bon: #006300;
  --texte-alerte: #8a5a00;
  --texte-critique: #b32d2d;
  --fond-alerte: #fff6dc;
  --fond-critique: #fdecec;
  --voile: rgba(15, 33, 54, 0.45);
  --f: "Archivo", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plan: #0b1220; --surface: #121b2b; --encre: #e8eef6; --encre-2: #b4c0cf; --encre-3: #8a98ab;
    --trait: #223046; --trait-fort: #33445c; --bleu: #6aa6ee; --bleu-fonce: #8dbbf3; --bleu-pale: #17283f; --sur-bleu: #0b1220;
    --surlignage: #3d3511; --serie: #3987e5; --serie-attenue: #184f95; --piste: #0d366b;
    --texte-bon: #2fbf2f; --texte-alerte: #fab219; --texte-critique: #f08a8a; --fond-alerte: #2e2608; --fond-critique: #3a1717;
    --voile: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plan: #0b1220; --surface: #121b2b; --encre: #e8eef6; --encre-2: #b4c0cf; --encre-3: #8a98ab;
  --trait: #223046; --trait-fort: #33445c; --bleu: #6aa6ee; --bleu-fonce: #8dbbf3; --bleu-pale: #17283f; --sur-bleu: #0b1220;
  --surlignage: #3d3511; --serie: #3987e5; --serie-attenue: #184f95; --piste: #0d366b;
  --texte-bon: #2fbf2f; --texte-alerte: #fab219; --texte-critique: #f08a8a; --fond-alerte: #2e2608; --fond-critique: #3a1717;
  --voile: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--plan); color: var(--encre); font-family: var(--f); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
h1, h2, h3, p, ul, dl, dd, figure { margin: 0; }
ul { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; background: var(--surface); border-inline: 1px solid var(--trait); }

/* En-tête : date, puis apports, dépense, bilan */
.entete { flex: none; padding: 10px 16px 0; border-bottom: 1px solid var(--trait-fort); background: var(--surface); }
.nav { display: flex; align-items: center; gap: 8px; }
.nav.seul { padding-bottom: 10px; }
.nav-titre { flex: 1; min-width: 0; text-align: center; }
.nav-titre h1 { font-size: 17px; font-weight: 700; font-stretch: 112%; letter-spacing: 0.01em; text-wrap: balance; }
.nav-titre p { font-size: 12.5px; color: var(--encre-3); }
.nav-btn { flex: none; width: 40px; height: 40px; border: 1px solid var(--trait); border-radius: 50%; background: var(--surface); font-size: 22px; line-height: 1; color: var(--bleu); }
.nav-btn:disabled { color: var(--trait-fort); cursor: default; }
.retour-auj { display: block; margin: 2px auto 0; }
.chiffres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 12px; margin-top: 8px; }
.chiffre-col { display: flex; flex-direction: column; padding: 6px 0 8px; min-width: 0; }
.c-nom { font-size: 12px; font-weight: 600; font-stretch: 112%; color: var(--encre-2); }
.c-val { font-size: 32px; line-height: 1.05; font-weight: 800; font-stretch: 68%; letter-spacing: 0.01em; white-space: nowrap; }
.c-unite { font-size: 11.5px; color: var(--encre-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chiffre-col.solde { border-bottom: 4px double var(--encre); }

/* Corps défilant */
.scene { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 16px 20px; background: var(--surface); }
.bloc { padding: 14px 0 16px; border-bottom: 1px solid var(--trait); }
.bloc:last-child { border-bottom: 0; }
.bloc-titre { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; font-weight: 700; font-stretch: 118%; letter-spacing: 0.02em; color: var(--bleu-fonce); margin-bottom: 8px; }
.bloc-titre .unite { font-weight: 500; font-stretch: 100%; letter-spacing: 0; color: var(--encre-3); }
.bloc > * + * { margin-top: 8px; }
.bloc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.note { font-size: 12.5px; color: var(--encre-3); }
.note.centre { text-align: center; padding: 12px 0; }
.vide { color: var(--encre-2); }
.puces { display: grid; gap: 6px; }
.puces li { position: relative; padding-left: 14px; }
.puces li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--trait-fort); }
.pile { display: grid; gap: 8px; }
.reprise { margin-top: 12px; font-size: 13.5px; }
.choix { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--trait-fort); border-radius: 8px; background: var(--surface); cursor: pointer; }
.choix input { flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--bleu); }
.choix strong { display: block; }
.choix-detail { display: block; font-size: 13.5px; line-height: 1.4; color: var(--encre-2); }
.choix:has(input:checked) { border-color: var(--bleu); box-shadow: inset 0 0 0 1px var(--bleu); }
.grand { color: var(--encre-2); }
.grand-val { font-size: 34px; font-weight: 800; font-stretch: 68%; color: var(--encre); line-height: 1; }
.etat { font-size: 12.5px; font-weight: 600; color: var(--encre-2); }
.etat-complete { color: var(--texte-bon); }
.etat-a-verifier, .etat-vide { color: var(--texte-alerte); }

.btn { min-height: 42px; padding: 8px 16px; border: 1px solid var(--trait-fort); border-radius: 8px; background: var(--surface); font-weight: 600; text-align: center; }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn-principal { background: var(--bleu); border-color: var(--bleu); color: var(--sur-bleu); }
.btn-danger { color: var(--texte-critique); border-color: var(--texte-critique); }
.btn-petit { min-height: 34px; padding: 5px 12px; font-size: 13.5px; }
.lien { border: 0; background: none; padding: 6px 2px; color: var(--bleu); font-weight: 600; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
.puce { border: 1px solid var(--trait-fort); border-radius: 999px; background: var(--surface); padding: 6px 12px; font-size: 13px; text-align: left; }
.puce.active { background: var(--bleu); border-color: var(--bleu); color: var(--sur-bleu); }
.exemples, .puces-portions, .filtres { display: flex; flex-wrap: wrap; gap: 6px; }
.filtres { padding: 12px 0 2px; }

.avis { margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--bleu); background: var(--bleu-pale); border-radius: 0 8px 8px 0; font-size: 13.5px; }
.avis-alerte { border-color: var(--texte-alerte); background: var(--fond-alerte); }
.avis-critique { border-color: var(--texte-critique); background: var(--fond-critique); }
.avis-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* Registre des repas */
.repas + .repas { margin-top: 10px; }
.repas-tete { display: grid; grid-template-columns: 1fr auto 64px; align-items: baseline; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--encre); }
.repas-tete h3 { font-size: 14px; font-weight: 700; }
.repas-heure { font-size: 12px; color: var(--encre-3); font-variant-numeric: tabular-nums; }
.repas-tete.outils { grid-template-columns: 1fr auto auto 64px; }
.repas-outil { padding: 0 2px; font-size: 12.5px; }
.raccourcis { display: grid; gap: 8px; padding: 2px 0 12px; }
.raccourci-ligne { display: grid; grid-template-columns: 76px 1fr; align-items: start; gap: 8px; }
.raccourci-nom { font-size: 12.5px; font-weight: 600; color: var(--encre-2); padding-top: 7px; }
.raccourci-puces { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.raccourci-puces .lien { padding: 4px 2px; }
.repas-kcal, .l-kcal, .act-kcal { text-align: right; font-weight: 700; font-stretch: 75%; font-variant-numeric: tabular-nums; font-size: 16px; }
.ligne, .recu-ligne { display: grid; grid-template-columns: 1fr auto 64px; align-items: baseline; gap: 8px; width: 100%; padding: 8px 0; border: 0; border-bottom: 1px solid var(--trait); background: none; text-align: left; }
.l-nom { min-width: 0; overflow-wrap: anywhere; }
.l-sous { display: block; font-size: 12px; color: var(--encre-3); }
.l-qte { font-stretch: 75%; font-variant-numeric: tabular-nums; color: var(--encre-2); white-space: nowrap; }
.approx::before { content: "≈\00a0"; color: var(--encre-3); }
.ligne.annulee .l-nom, .ligne.annulee .l-qte, .ligne.annulee .l-kcal { text-decoration: line-through; color: var(--encre-3); }
.ligne.annulee .l-sous { text-decoration: none; }
.total-jour, .recu-total { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 0 6px; font-weight: 700; border-bottom: 4px double var(--encre); }
.macro-ligne { font-size: 12.5px; color: var(--encre-2); font-variant-numeric: tabular-nums; white-space: pre-wrap; }
@keyframes encrage { from { background: var(--surlignage); } to { background: transparent; } }
.ligne.neuve { animation: encrage 1.6s ease-out; }

.act-ligne { display: grid; grid-template-columns: minmax(64px, 1.2fr) minmax(64px, 1fr) minmax(52px, 0.9fr) 52px auto; align-items: baseline; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--trait); }
.act-nom { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.act-val { font-variant-numeric: tabular-nums; }
.act-val-large { grid-column: span 2; }
.act-det { font-size: 12.5px; color: var(--encre-3); }
.act-ligne .lien { padding: 4px 0; justify-self: end; }

/* Fil des échanges */
.fil { display: grid; gap: 10px; padding: 14px 0 4px; }
.carte { padding: 10px 12px; border: 1px solid var(--trait); border-radius: 10px; background: var(--plan); }
.carte > * + * { margin-top: 6px; }
.carte.moi { justify-self: end; max-width: 88%; background: var(--bleu-pale); border-color: transparent; border-radius: 14px 14px 2px 14px; }
.carte-ok { border-left: 4px solid var(--texte-bon); border-radius: 0 10px 10px 0; }
.carte-erreur { border-left: 4px solid var(--texte-critique); border-radius: 0 10px 10px 0; background: var(--fond-critique); }
.carte-question { border-left: 4px solid var(--texte-alerte); border-radius: 0 10px 10px 0; background: var(--fond-alerte); }
.carte-titre { font-size: 12.5px; font-weight: 700; font-stretch: 118%; letter-spacing: 0.02em; }
.carte-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.recu-date { font-weight: 600; font-size: 13.5px; }
.recu-ligne { padding: 6px 0; }
.recu-total { border-bottom-width: 4px; }

/* Saisie */
.saisie { flex: none; padding: 8px 16px 6px; border-top: 1px solid var(--trait-fort); background: var(--surface); }
.saisie-etat { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--encre-2); padding-bottom: 6px; }
.saisie-etat .lien { margin-left: auto; padding: 0; }
.pouls { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--bleu); animation: pouls 1s ease-in-out infinite alternate; }
@keyframes pouls { from { opacity: 0.25; } to { opacity: 1; } }
.saisie-ligne { display: flex; align-items: flex-end; gap: 8px; }
.saisie-ligne textarea { flex: 1; min-width: 0; min-height: 42px; max-height: 120px; resize: none; padding: 9px 12px; border: 1px solid var(--trait-fort); border-radius: 8px; background: var(--surface); line-height: 1.35; }
.saisie-outils { display: flex; gap: 16px; }

.onglets { flex: none; display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--trait); background: var(--surface); }
.onglet { min-height: 46px; padding: 6px 1px; border: 0; border-top: 3px solid transparent; background: none; font-size: 12.5px; font-weight: 600; font-stretch: 85%; color: var(--encre-3); }
@media (max-width: 380px) { .onglet { font-size: 11.5px; font-stretch: 78%; } }
.onglet.actif { color: var(--bleu); border-top-color: var(--bleu); }

/* Tableaux, barres, jauges, graphique */
.tableau-defile { overflow-x: auto; }
.tableau { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tableau th, .tableau td { padding: 6px 6px; border-bottom: 1px solid var(--trait); text-align: left; vertical-align: baseline; }
.tableau thead th { font-size: 12px; font-weight: 600; color: var(--encre-3); border-bottom: 1px solid var(--encre); white-space: nowrap; }
.tableau tbody th { font-weight: 500; }
.tableau .num { text-align: right; font-stretch: 75%; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tableau .txt { font-size: 12.5px; color: var(--encre-2); min-width: 120px; }
.tableau tr.total th, .tableau tr.total td { font-weight: 700; border-top: 1px solid var(--encre); }
.tableau tr.double th, .tableau tr.double td { border-bottom: 4px double var(--encre); }
.tableau tr.auj th { color: var(--bleu); font-weight: 700; }
.tableau.etroit th:first-child { width: 68%; }
.tableau.jours tbody th { white-space: nowrap; }
.tableau.jours .txt { min-width: 0; }

.barres { display: grid; gap: 8px; }
.barre-ligne { display: grid; grid-template-columns: 104px 1fr; grid-template-areas: "nom val" "piste piste"; gap: 3px 8px; align-items: baseline; }
.barre-nom { grid-area: nom; font-weight: 600; font-size: 13.5px; }
.barre-val { grid-area: val; text-align: right; font-size: 13px; color: var(--encre-2); font-variant-numeric: tabular-nums; }
.barre-piste { grid-area: piste; height: 12px; border-left: 1px solid var(--trait-fort); }
.barre-plein { display: block; height: 12px; min-width: 2px; background: var(--serie); border-radius: 0 4px 4px 0; }
.jauges { display: grid; gap: 12px; }
.jauge-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.jauge-nom { font-weight: 600; font-size: 13.5px; }
.jauge-val { font-size: 13px; color: var(--encre-2); font-variant-numeric: tabular-nums; }
.jauge-piste { position: relative; height: 10px; margin: 4px 0 9px; background: var(--piste); border-radius: 5px; }
.jauge-plein { position: absolute; inset: 0 auto 0 0; background: var(--serie); border-radius: 5px; }
.jauge-repere { position: absolute; top: 13px; height: 4px; border: 1px solid var(--encre-2); border-top: 0; }
.jauge-pied { font-size: 11.5px; color: var(--encre-3); }

.figure { margin: 0; }
.graphique { display: block; width: 100%; height: auto; overflow: visible; }
.graphique .grille { stroke: var(--trait); stroke-width: 1; }
.graphique .axe { stroke: var(--trait-fort); stroke-width: 1; }
.graphique .tic { fill: var(--encre-3); font-size: 10px; font-variant-numeric: tabular-nums; }
.graphique .sous { font-size: 9px; }
.graphique .jour { fill: var(--encre-2); font-size: 10.5px; font-weight: 600; }
.graphique .jour.auj { fill: var(--bleu); }
.graphique .etiquette { fill: var(--encre); font-size: 10.5px; font-weight: 700; }
.graphique .colonne { fill: var(--serie); }
.graphique .colonne.partielle { fill: var(--serie-attenue); }
.graphique .repere-fond { stroke: var(--surface); stroke-width: 6; }
.graphique .repere { stroke: var(--encre); stroke-width: 2; stroke-linecap: round; }
.graphique .tendance { fill: none; stroke: var(--serie); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.graphique .pesee { fill: var(--surface); stroke: var(--serie); stroke-width: 2; }
.graphique .zone { fill: transparent; cursor: pointer; }
.graphique .zone:hover, .graphique .zone:focus-visible { fill: var(--bleu); fill-opacity: 0.07; outline: none; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--encre-2); padding-top: 4px; }
.cle { display: inline-flex; align-items: center; gap: 6px; }
.cle-rect { width: 12px; height: 12px; border-radius: 3px 3px 0 0; background: var(--serie); }
.cle-rect.partielle { background: var(--serie-attenue); }
.cle-trait { width: 16px; height: 2px; background: var(--encre); border-radius: 1px; }
.cle-rond { width: 10px; height: 10px; border: 2px solid var(--serie); border-radius: 50%; background: var(--surface); }
.cle-ligne { width: 16px; height: 2px; background: var(--serie); border-radius: 1px; }

.tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; padding-top: 6px; }
.tuile { display: flex; flex-direction: column; padding: 10px 0; border-bottom: 1px solid var(--trait); min-width: 0; }
.t-nom { font-size: 12px; font-weight: 600; font-stretch: 112%; color: var(--encre-2); }
.t-val { font-size: 24px; font-weight: 800; font-stretch: 70%; line-height: 1.15; white-space: nowrap; }
.t-sous { font-size: 11.5px; color: var(--encre-3); }

.jour-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; border: 0; background: none; padding: 0; text-align: left; }
.jour-nom { font-weight: 700; color: var(--bleu); text-decoration: underline; text-underline-offset: 3px; }
.jour-kcal { font-weight: 700; font-stretch: 75%; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Formulaires et dialogues */
.champ { display: grid; gap: 4px; margin-top: 10px; }
.champ label { font-size: 12.5px; font-weight: 600; color: var(--encre-2); }
.champ input, .champ select, .texte-export { width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--trait-fort); border-radius: 8px; background: var(--surface); }
.texte-export { font-size: 12px; min-height: 140px; }
.aide { font-size: 12px; color: var(--encre-3); margin-top: 4px; }
.erreur-form { margin-top: 10px; padding: 8px 10px; border-left: 4px solid var(--texte-critique); background: var(--fond-critique); font-size: 13px; }
.grille-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grille-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 10px; }
.resultats { display: grid; margin-top: 4px; }
.resultat { display: flex; justify-content: space-between; gap: 8px; padding: 9px 4px; border: 0; border-bottom: 1px solid var(--trait); background: none; text-align: left; }
.aliments { display: grid; margin-top: 6px; border-top: 1px solid var(--encre); }
.aliment { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; width: 100%; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--trait); background: none; color: inherit; text-align: left; cursor: pointer; }
.aliment-nom { min-width: 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.aliment-kcal { font-size: 17px; font-weight: 700; font-stretch: 75%; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.1; }
.aliment-unite { display: block; font-size: 11.5px; font-weight: 500; font-stretch: 100%; color: var(--encre-3); }
.dialogue-corps .sous-titre { margin-top: 16px; font-size: 14px; font-weight: 700; color: var(--encre); }
/* Corpulence : un indicateur par ligne, valeur alignée à droite, repère en dessous du nom. */
.indics { margin-top: 2px; }
.indic { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--trait); }
.indic-nom { font-weight: 600; min-width: 0; }
.indic-nom .l-sous { font-weight: 400; margin-top: 2px; }
.indic-val { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Annotation en marge du registre : lignes enregistrées avec d'autres valeurs que celles de l'aliment. */
.aligner { margin-top: 12px; padding: 8px 10px; border-left: 4px solid var(--bleu); background: var(--bleu-pale); font-size: 13.5px; }
.aligner .puces { margin: 6px 0 8px; }
.resultat .chiffre { flex: none; font-size: 12.5px; color: var(--encre-3); font-variant-numeric: tabular-nums; }
.selection { margin-top: 8px; padding: 8px 10px; background: var(--bleu-pale); border-radius: 8px; font-weight: 600; }
.puces-portions { margin-top: 8px; }
.portions { display: grid; border-top: 1px solid var(--encre); }
.portion { display: grid; grid-template-columns: 22px 1fr auto 48px; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--trait); }
.portion input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--bleu); }
.portion .l-nom { font-size: 14px; }
.portion-q { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--encre-2); }
.portion-q input { width: 74px; min-height: 38px; padding: 6px 8px; border: 1px solid var(--trait-fort); border-radius: 8px; background: var(--surface); text-align: right; font-variant-numeric: tabular-nums; }
.portion-u { font-size: 13px; }
.portion.exclue .l-nom, .portion.exclue .l-kcal { color: var(--encre-3); text-decoration: line-through; }
.portion-total { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0 6px; font-weight: 700; border-bottom: 4px double var(--encre); }
.favori { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--trait); }
.favori-texte { min-width: 0; }
.favori-texte strong { display: block; overflow-wrap: anywhere; }
.favori-liens { display: flex; gap: 16px; }
.favori-liens .lien { padding: 4px 0; font-size: 12.5px; }
.dl-meta { font-size: 12.5px; color: var(--encre-3); }
.valeurs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
.valeurs dt { font-size: 11.5px; color: var(--encre-3); }
.valeurs dd { font-weight: 700; font-stretch: 75%; font-variant-numeric: tabular-nums; white-space: nowrap; }
.historique-ligne { margin-top: 10px; font-size: 13px; }
.historique-ligne summary { cursor: pointer; font-weight: 600; color: var(--bleu); padding: 6px 0; }
.fiche { display: grid; gap: 8px; }
.fiche dt { font-size: 12px; font-weight: 600; color: var(--encre-3); }
.controle { display: grid; gap: 8px; }
.controle li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: baseline; font-size: 13.5px; }
.controle-marque { font-size: 12px; font-weight: 700; text-align: center; padding: 2px 4px; border-radius: 4px; border: 1px solid currentColor; }
.controle .ok .controle-marque { color: var(--texte-bon); }
.controle .ko .controle-marque { color: var(--texte-critique); }
.controle .doux .controle-marque { color: var(--texte-alerte); }

.voile { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--voile); }
.dialogue { width: 100%; max-width: 620px; max-height: 92%; display: flex; flex-direction: column; background: var(--surface); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25); }
.dialogue-titre { flex: none; padding: 14px 16px 8px; font-size: 17px; font-weight: 700; text-wrap: balance; }
.dialogue-corps { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 12px; }
.dialogue-corps > div > * + * { margin-top: 8px; }
.dialogue-pied { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--trait); }
@media (min-width: 640px) { .voile { align-items: center; } .dialogue { border-radius: 14px; } }

.bulle { position: fixed; z-index: 30; max-width: 240px; padding: 8px 10px; border-radius: 8px; background: var(--encre); color: var(--surface); font-size: 12.5px; pointer-events: none; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25); }
.bulle-titre { font-weight: 700; margin-bottom: 2px; }
.bulle strong { font-variant-numeric: tabular-nums; }
.toast { position: fixed; z-index: 40; left: 50%; top: 10px; transform: translateX(-50%); width: max-content; max-width: min(92%, 560px); padding: 10px 14px; border-radius: 8px; background: var(--encre); color: var(--surface); font-size: 13.5px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25); }
.chargement { padding: 32px 16px; color: var(--encre-2); }
@media (prefers-reduced-motion: reduce) { .ligne.neuve, .pouls { animation: none; } }
@media (max-width: 360px) { .c-val { font-size: 27px; } .valeurs { grid-template-columns: repeat(3, 1fr); } .act-ligne { grid-template-columns: 1.2fr 1fr 0.8fr 44px auto; } }

</style>
</head>

  function estInstallee() {
    try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; }
  }
  function telecharger(nom, data, type) {
    var url = URL.createObjectURL(new Blob([data], { type: type })), a = document.createElement('a');
    a.href = url; a.download = nom; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
  var gr = function (x) { return C.fmt1(x) + ' g'; };

  // ------------------------------------------------------------------ état
  var S = {
    view: 'journal', date: null, today: null, week: null, days: new Map(), wIdx: [], mIdx: [],
    meta: { k: 'meta', schema: 1, createdAt: null, lastBackupAt: null, lastBackupLignes: 0, changes: 0, profile: null, favoris: [], mesAliments: [] },
    storeKind: 'attente', persist: null, usage: null, loss: null, ready: false,
    thread: [], turns: [], busy: false, ecrit: false, abort: null, caps: { done: false, sample: null, sansJson: false, downloads: null },
    histRange: 'semaine', refQuery: '', selfTest: null, flash: {}, scrollEnd: false, install: null, al: { q: '', famille: '', tri: 'nom' }
  };
  var INSTRUCTIONS = C.buildInstructions();

  // ------------------------------------------- dépôt local (sur l'appareil)
  // Base IndexedDB du navigateur ; à défaut localStorage ; à défaut mémoire vive (rien n'est conservé).
  var Depot = (function () {
    var NAME = 'suivi-nutritionnel', kind = 'memoire', idb = null, mem = { jours: {}, meta: null };
    function req(r) { return new Promise(function (res, rej) { r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
    function txDone(t) { return new Promise(function (res, rej) { t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; t.onabort = function () { rej(t.error || new Error('écriture annulée')); }; }); }
    function openIdb() {
      return new Promise(function (res, rej) {
        var done = false, r;
        var timer = setTimeout(function () { if (!done) { done = true; rej(new Error('délai dépassé')); } }, 6000);
        try { r = window.indexedDB.open(NAME, 1); } catch (e) { clearTimeout(timer); rej(e); return; }
        r.onupgradeneeded = function () {
          var db = r.result;
          if (!db.objectStoreNames.contains('jours')) db.createObjectStore('jours', { keyPath: 'date' });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
        };
        r.onsuccess = function () { if (done) { try { r.result.close(); } catch (e) { /* rien */ } return; } done = true; clearTimeout(timer); res(r.result); };
        r.onerror = function () { if (!done) { done = true; clearTimeout(timer); rej(r.error || new Error('ouverture refusée')); } };
        r.onblocked = function () { if (!done) { done = true; clearTimeout(timer); rej(new Error('base bloquée')); } };
      });
    }
    function lsGet(k) { try { var v = window.localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } }
    function lsSet(k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
    function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* rien */ } }
    function lsOk() { try { window.localStorage.setItem('sn.sonde', '1'); var ok = window.localStorage.getItem('sn.sonde') === '1'; window.localStorage.removeItem('sn.sonde'); return ok; } catch (e) { return false; } }
    function lsKeys(prefix) { var out = []; try { for (var i = 0; i < window.localStorage.length; i++) { var k = window.localStorage.key(i); if (k && k.indexOf(prefix) === 0) out.push(k); } } catch (e) { /* rien */ } return out; }
    async function probe() {
      var stampV = Date.now();
      if (kind === 'idb') {
        var t = idb.transaction('meta', 'readwrite'); t.objectStore('meta').put({ k: 'sonde', v: stampV }); await txDone(t);
        var back = await req(idb.transaction('meta', 'readonly').objectStore('meta').get('sonde'));
        var t2 = idb.transaction('meta', 'readwrite'); t2.objectStore('meta').delete('sonde'); await txDone(t2);
        return !!back && back.v === stampV;
      }
      if (kind === 'local') return lsOk();
      return false;
    }
    async function init() {
      try {
        if (!window.indexedDB) throw new Error('indisponible');
        idb = await openIdb(); kind = 'idb';
        if (!(await probe())) throw new Error('relecture impossible');
      } catch (e) {
        try { if (idb) idb.close(); } catch (e2) { /* rien */ }
        idb = null; kind = lsOk() ? 'local' : 'memoire';
      }
      return kind;
    }
    async function readAll() {
      if (kind === 'idb') return req(idb.transaction('jours', 'readonly').objectStore('jours').getAll());
      if (kind === 'local') return lsKeys('sn.jour.').map(lsGet).filter(Boolean);
      return Object.keys(mem.jours).map(function (k) { return mem.jours[k]; });
    }
    async function putDay(doc) {
      if (kind === 'idb') { var t = idb.transaction('jours', 'readwrite'); t.objectStore('jours').put(doc); await txDone(t); }
      else if (kind === 'local') { if (!lsSet('sn.jour.' + doc.date, doc)) throw new Error('stockage plein ou refusé'); }
      else mem.jours[doc.date] = doc;
    }
    async function readMeta() {
      if (kind === 'idb') return req(idb.transaction('meta', 'readonly').objectStore('meta').get('meta'));
      if (kind === 'local') return lsGet('sn.meta');
      return mem.meta;
    }
    async function putMeta(meta) {
      if (kind === 'idb') { var t = idb.transaction('meta', 'readwrite'); t.objectStore('meta').put(meta); await txDone(t); }
      else if (kind === 'local') lsSet('sn.meta', meta);
      else mem.meta = meta;
    }
    return {
      init: init, probe: probe, readAll: readAll, putDay: putDay, readMeta: readMeta, putMeta: putMeta,
      kind: function () { return kind; },
      // témoin et copie de secours, tenus à part dans localStorage quand la base principale est IndexedDB
      sentinel: function () { return lsGet('sn.temoin'); },
      setSentinel: function (v) { lsSet('sn.temoin', v); },
      snapshot: function () { return kind === 'idb' ? lsGet('sn.copie') : null; },
      setSnapshot: function (v) { if (kind !== 'idb') return false; var ok = lsSet('sn.copie', v); if (!ok) lsDel('sn.copie'); return ok; }
    };
  })();

  var chain = Promise.resolve();
  function enqueue(fn) { var p = chain.then(fn); chain = p.catch(function () { /* l'erreur est rendue à l'appelant */ }); return p; }
  var snapTimer = null;
  function afterWrite() {
    S.wIdx = C.weightIndex(S.days);
    S.mIdx = C.mesuresIndex(S.days);
    var days = Array.from(S.days.values());
    Depot.setSentinel({ lignes: C.countEntries(days), jours: days.filter(C.dayHasData).length, le: new Date().toISOString() });
    clearTimeout(snapTimer);
    snapTimer = setTimeout(function () {
      var text = JSON.stringify(C.buildBackup(Array.from(S.days.values()), S.meta.profile, new Date().toISOString(), S.meta.favoris, S.meta.mesAliments));
      if (text.length <= 1800000) Depot.setSnapshot(JSON.parse(text));
    }, 1200);
  }
  function changeDay(date, mutate, weight) {
    return enqueue(async function () {
      var cur = S.days.get(date), doc = cur ? C.clone(cur) : C.emptyDay(date);
      if (!doc.entries) doc.entries = [];
      if (!doc.acts) doc.acts = [];
      mutate(doc);
      doc.updatedAt = new Date().toISOString();
      await Depot.putDay(doc);
      S.days.set(date, doc);
      S.meta.changes = (S.meta.changes || 0) + (weight == null ? 1 : weight);
      await Depot.putMeta(S.meta);
      afterWrite();
      return doc;
    });
  }
  function saveMeta() { return enqueue(function () { return Depot.putMeta(S.meta); }); }
  // Favoris et Mes aliments : listes rangées avec les réglages. Une liste n'est remplacée en mémoire qu'une fois écrite.
  function saveListe(cle, mutate) {
    return enqueue(async function () {
      var list = C.clone(S.meta[cle] || []), now = new Date().toISOString();
      var res = mutate(list, now);
      var patch = { changes: (S.meta.changes || 0) + 1 };
      patch[cle] = list;
      var next = Object.assign({}, S.meta, patch);
      await Depot.putMeta(next);
      S.meta = next;
      afterWrite();
      return res;
    });
  }
  function saveFavoris(mutate) { return saveListe('favoris', mutate); }
  function saveMesAliments(mutate) { return saveListe('mesAliments', mutate); }
  function ajouterMesAliments(liste) {
    if (!liste || !liste.length) return Promise.resolve([]);
    return saveMesAliments(function (list) { liste.forEach(function (m) { list.push(m); }); return liste; });
  }
  function editMesAliment(id, fn) {
    return saveMesAliments(function (list, now) {
      var m = list.find(function (x) { return x.id === id; });
      if (m) { fn(m, now); m.updatedAt = now; }
      return m;
    });
  }
  // Aliments du journal absents de la table et de Mes aliments : ajoutés à Mes aliments (au démarrage, après une restauration).
  async function amorcerMesAliments() {
    var nouveaux = C.persoDepuisJournal(S.days, S.meta.mesAliments, new Date().toISOString());
    if (nouveaux.length) await ajouterMesAliments(nouveaux);
    return nouveaux;
  }
  function addFavori(data) { return saveFavoris(function (list, now) { var f = C.makeFavorite(data, now); list.push(f); return f; }); }
  function editFavori(id, fn) {
    return saveFavoris(function (list, now) {
      var f = list.find(function (x) { return x.id === id; });
      if (f) { fn(f); f.updatedAt = now; }
      return f;
    });
  }
  function favoriUtilise(id) { return editFavori(id, function (f) { f.uses = (f.uses || 0) + 1; f.lastUsedAt = new Date().toISOString(); }); }

  // -------------------------------------------------------- actions de base
  function dayInfo(date) {
    var doc = S.days.get(date), tot = C.totals(doc ? doc.entries : []);
    var kg = C.weightAt(S.wIdx, S.meta.profile, date);
    return { date: date, doc: doc, tot: tot, kg: kg, en: C.dayEnergy(doc, tot, S.meta.profile, kg, date), st: C.dayStatus(tot, date, S.today) };
  }
  async function addEntries(list) { // list : [{ date, data }]
    var byDate = {}, made = [], now = new Date().toISOString();
    list.forEach(function (x) { (byDate[x.date] || (byDate[x.date] = [])).push(x); });
    for (var date of Object.keys(byDate)) {
      var batch = byDate[date].map(function (x) { return C.makeEntry(x.data, now); });
      await changeDay(date, function (doc) { batch.forEach(function (e) { doc.entries.push(e); }); }, batch.length);
      batch.forEach(function (e) { made.push({ date: date, entry: e }); S.flash[e.id] = 1; });
    }
    return made;
  }
  function updateEntry(date, id, fn) {
    return changeDay(date, function (doc) {
      var i = doc.entries.findIndex(function (e) { return e.id === id; });
      if (i >= 0) doc.entries[i] = fn(doc.entries[i]);
    });
  }
  function correct(date, id, changes) { var now = new Date().toISOString(); S.flash[id] = 1; return updateEntry(date, id, function (e) { return C.correctEntry(e, changes, now); }); }
  function setEntryStatus(date, id, status) { var now = new Date().toISOString(); return updateEntry(date, id, function (e) { return C.setStatus(e, status, now); }); }
  function setSteps(date, n, mode) {
    return changeDay(date, function (doc) {
      doc.steps = mode === 'ajout' ? (doc.steps || 0) + n : n;
      doc.stepsAt = new Date().toISOString();
    });
  }
  function clearSteps(date) { return changeDay(date, function (doc) { doc.steps = null; doc.stepsAt = new Date().toISOString(); }); }
  function addAct(date, data) { var a = C.makeAct(data, new Date().toISOString()); return changeDay(date, function (doc) { doc.acts.push(a); }).then(function () { return a; }); }
  function setActStatus(date, id, status) {
    return changeDay(date, function (doc) {
      var a = doc.acts.find(function (x) { return x.id === id; });
      if (a) { a.status = status; a.updatedAt = new Date().toISOString(); }
    });
  }
  function setWeight(date, kg) { return changeDay(date, function (doc) { doc.weight = kg; doc.weightAt = new Date().toISOString(); }); }
  // Mensurations du jour : une valeur absente laisse la précédente en place (rien n'est effacé).
  function setMesures(date, m) {
    return changeDay(date, function (doc) {
      var t = new Date().toISOString();
      if (m.waist != null) { doc.waist = m.waist; doc.waistAt = t; }
      if (m.hip != null) { doc.hip = m.hip; doc.hipAt = t; }
    });
  }
  function lignesMesures(date, m) {
    var l = [];
    if (m.waist != null) l.push('Tour de taille enregistré pour ' + C.frDate(date, 'moyen') + ' : ' + C.fmt1(m.waist) + ' cm');
    if (m.hip != null) l.push('Tour de hanches enregistré pour ' + C.frDate(date, 'moyen') + ' : ' + C.fmt1(m.hip) + ' cm');
    return l;
  }
  async function saveProfile(p) {
    S.meta.profile = Object.assign({}, p, { majLe: new Date().toISOString() });
    S.meta.changes = (S.meta.changes || 0) + 1;
    await saveMeta();
    afterWrite();
  }

  // ----------------------------------------------------- fil de discussion
  function pushCard(card) {
    card.id = 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1000);
    S.thread.push(card);
    if (S.thread.length > 14) S.thread = S.thread.slice(-14);
    S.scrollEnd = true;
    return card;
  }
  function dropCard(card) { S.thread = S.thread.filter(function (c) { return c !== card; }); }
  var ERREURS = {
    not_granted: "Vous n'avez pas autorisé cette page à utiliser Claude. Pour cette visite, utilisez la saisie manuelle.",
    sampling_disabled: "Claude n'est pas disponible pour ce compte. Utilisez la saisie manuelle.",
    not_declared: "L'analyse par Claude n'est pas activée pour cette page. Utilisez la saisie manuelle.",
    capability_disabled: "L'analyse par Claude n'est pas disponible dans cette vue. Utilisez la saisie manuelle.",
    capability_removed: "L'analyse par Claude n'est pas disponible dans cette vue. Utilisez la saisie manuelle.",
    rate_limited: 'Trop de demandes pour le moment. Réessayez dans quelques instants.',
    session_expired: 'Votre session a expiré. Reconnectez-vous à Claude, puis réessayez.',
    refused: "Claude n'a pas traité ce message. Reformulez-le, ou utilisez la saisie manuelle.",
    empty_completion: "L'analyse n'a rien renvoyé. Reformulez votre message en étant plus précis.",
    invalid_json: "La réponse de Claude était illisible. Rien n'a été enregistré : réessayez.",
    prompt_too_large: 'Message trop long. Envoyez un repas à la fois.',
    upstream_error: "L'analyse a été interrompue par un problème de connexion. Rien n'a été enregistré : réessayez."
  };
  function recentEntries(today) {
    var map = {};
    for (var i = 0; i < 3; i++) {
      var d = C.addDays(today, -i), doc = S.days.get(d);
      ((doc && doc.entries) || []).forEach(function (e) { map[e.id] = { date: d, entry: e }; });
    }
    return map;
  }
  var capsReady = null;
  // Demande à Claude une réponse en JSON. Si la méthode json manque dans la vue (application plus ancienne),
  // la réponse est demandée en texte, puis lue ici avec la même tolérance.
  async function demanderJson(input, opts) {
    var sp = S.caps.sample;
    if (typeof sp.json === 'function' && !S.caps.sansJson) {
      try { return await sp.json(input, opts); }
      catch (e) {
        if (!e || e.code !== 'capability_removed' || typeof sp !== 'function') throw e;
        S.caps.sansJson = true;
      }
    }
    if (typeof sp !== 'function') throw { code: 'capability_removed', message: 'appel à Claude indisponible' };
    var r = await sp(input, opts);
    var v = r && !r.truncated ? C.parseJsonLoose(r.text) : undefined;
    if (v === undefined) throw { code: 'invalid_json', message: 'réponse sans JSON lisible', text: r && r.text };
    return v;
  }
  async function envoyer(text) {
    text = String(text || '').trim();
    if (!text || S.busy) return;
    var now = C.nowTunis();
    S.today = now.date;
    // Nom exact d'un favori : sa composition est proposée pour confirmation, sans appel à Claude.
    var fav = C.favoriteByName(S.meta.favoris, text);
    if (fav) { dialogueReprise({ fav: fav, date: S.date }); return; }
    if (!WEB) pushCard({ type: 'moi', text: text });
    var cmd = C.localCommand(text, now.date);
    if (cmd && cmd.view) { if (cmd.famille != null) S.al.famille = cmd.famille; go(cmd.view); return; }
    if (cmd && cmd.steps != null) {
      await setSteps(cmd.date, cmd.steps, 'total');
      pushCard({ type: 'activite', date: cmd.date, lines: ['Pas enregistrés : ' + C.fmtInt(cmd.steps)] });
      S.date = cmd.date; render(); return;
    }
    if (cmd && cmd.erreur) { pushCard({ type: 'erreur', text: cmd.erreur }); render(); return; }
    if (cmd && cmd.mesures) {
      await setMesures(cmd.date, cmd.mesures);
      pushCard({ type: 'activite', date: cmd.date, lines: lignesMesures(cmd.date, cmd.mesures) });
      S.date = cmd.date; render(); return;
    }
    // Version web : pas d'analyse des phrases. La saisie s'ouvre sur la recherche dans la table, avec les grammes écrits.
    if (WEB) { dialogueManuel(C.splitFoodQty(text)); return; }
    S.busy = true; render();
    try {
      await capsReady;
      if (!S.caps.sample) { pushCard({ type: 'erreur', text: ERREURS.capability_disabled, manual: true }); return false; }
      S.abort = new AbortController(); S.ecrit = false;
      var opts = { cache: false, signal: S.abort.signal, onText: function () { if (S.busy && !S.ecrit) { S.ecrit = true; renderSaisie(); } } };
      if (S.meta.analyse === 'rapide') opts.modelTier = 'quick';
      var input = [{ role: 'user', content: INSTRUCTIONS }].concat(S.turns.slice(-6))
        .concat([{ role: 'user', content: C.buildContext({ days: S.days, now: now, text: text, perso: S.meta.mesAliments }) }]);
      var resp = await demanderJson(input, opts);
      S.turns.push({ role: 'user', content: text }, { role: 'assistant', content: JSON.stringify(resp).slice(0, 3000) });
      await appliquer(C.interpret(resp, { today: now.date, time: now.time, entries: recentEntries(now.date), perso: S.meta.mesAliments, nowIso: new Date().toISOString() }));
    } catch (e) {
      var code = e && e.code;
      if (code !== 'cancelled') {
        pushCard({ type: 'erreur', text: ERREURS[code] || (code ? "L'analyse a échoué (code " + code + "). Rien n'a été enregistré : réessayez, ou utilisez la saisie manuelle." : "Une erreur est survenue pendant l'enregistrement : " + ((e && e.message) || 'inconnue') + '.'), manual: code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed' });
        if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared') S.caps.sample = null;
      } else pushCard({ type: 'info', text: 'Analyse arrêtée. Rien n\'a été enregistré.' });
      return false;
    } finally {
      S.busy = false; S.ecrit = false; S.abort = null; render();
    }
  }
  async function appliquer(plan) {
    if (plan.error) { pushCard({ type: 'erreur', text: ERREURS.invalid_json }); return; }
    // Aliments vus pour la première fois : rangés dans Mes aliments avant les lignes, pour les saisies suivantes.
    if (plan.nouveaux && plan.nouveaux.length) await ajouterMesAliments(plan.nouveaux);
    var fresh = [], dups = [], lines = [];
    plan.adds.forEach(function (a) {
      var doc = S.days.get(a.date);
      var hit = C.findDuplicates((doc && doc.entries) || [], a.data).length || fresh.some(function (f) { return f.date === a.date && C.findDuplicates([C.makeEntry(f.data, '')], a.data).length; });
      (hit ? dups : fresh).push(a);
    });
    var made = fresh.length ? await addEntries(fresh) : [];
    if (plan.steps) {
      await setSteps(plan.steps.date, plan.steps.n, plan.steps.mode);
      lines.push('Pas enregistrés pour ' + C.frDate(plan.steps.date, 'moyen') + ' : ' + C.fmtInt(S.days.get(plan.steps.date).steps));
    }
    for (var a of plan.acts) {
      await addAct(a.date, a.data);
      lines.push(a.data.label + ', ' + a.data.min + ' min, enregistré pour ' + C.frDate(a.date, 'moyen'));
    }
    if (plan.weight) {
      await setWeight(plan.weight.date, plan.weight.kg);
      lines.push('Poids enregistré pour ' + C.frDate(plan.weight.date, 'moyen') + ' : ' + C.fmt1(plan.weight.kg) + ' kg');
    }
    if (plan.mesures) {
      await setMesures(plan.mesures.date, plan.mesures);
      lines = lines.concat(lignesMesures(plan.mesures.date, plan.mesures));
    }
    if (made.length) {
      pushCard({ type: 'enregistre', made: made, inferred: fresh.some(function (x) { return x.mealInferred; }), remarks: plan.remarks });
      S.date = made[made.length - 1].date;
    } else if (plan.remarks.length && !lines.length) pushCard({ type: 'info', text: plan.remarks.join(' ') });
    if (lines.length) pushCard({ type: 'activite', lines: lines, remarks: made.length ? [] : plan.remarks });
    dups.forEach(function (d) { pushCard({ type: 'doublon', add: d }); });
    if (plan.corrections.length || plan.cancels.length) pushCard({ type: 'confirmer', corrections: plan.corrections, cancels: plan.cancels });
    if (plan.rejected.length) pushCard({ type: 'erreur', text: 'Non enregistré : ' + plan.rejected.map(function (r) { return r.nom + ' (' + r.reason + ')'; }).join(' ; ') + '.' });
    if (plan.asks.length) pushCard({ type: 'question', asks: plan.asks });
    var nothing = !made.length && !lines.length && !dups.length && !plan.corrections.length && !plan.cancels.length && !plan.rejected.length && !plan.asks.length;
    if (plan.view) { if (plan.viewDate) { S.date = plan.viewDate; S.week = C.weekStart(plan.viewDate); } go(plan.view); return; }
    if (nothing && !plan.remarks.length) pushCard({ type: 'info', text: plan.message || "Je n'ai rien trouvé à enregistrer dans ce message." });
    else if (nothing && plan.message && plan.intent === 'question') pushCard({ type: 'info', text: plan.message });
  }

  // ----------------------------------------------- fichiers : export, sauvegarde
  var toastTimer = null;
  function toast(text) {
    var t = $('toast');
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }
  var DL_ERREURS = {
    declined: "Enregistrement annulé : le fichier n'a pas été écrit.",
    rate_limited: 'Une demande d\'enregistrement est déjà en cours. Répondez-y, puis réessayez.',

    box.appendChild(titre);
    box.appendChild(h('div', { class: 'dialogue-corps' }, o.corps));

        onclick: async function (ev) {

          close();

    box.appendChild(pied);
    $('dialogues').appendChild(voile);
    document.addEventListener('keydown', onKey);
    // Par défaut, le premier champ reçoit le focus ; focusTitre le donne au titre (pas de clavier ni de défilement).
    // Si un champ de la boîte a déjà le focus (touché très vite, téléphone lent), on ne le lui reprend pas :
    // sinon la saisie en cours partirait dans le premier champ.
    var first = o.focusTitre ? titre : box.querySelector('input:not([type=hidden]), select, textarea') || box.querySelector('button');
